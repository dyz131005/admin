<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --dark: #111827;
            --gray: #6b7280;
            --gray-light: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .btn {
            padding: 15px 35px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn:hover { background: #4338ca; transform: translateY(-2px); }

        .form-control {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--gray-light);
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .error-message {
            display: none;
            padding: 12px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .error-message.show { display: block; }

        .admin-panel { display: none; padding: 40px 0; }

        .admin-header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .admin-title {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
        }

        .logout-btn {
            padding: 10px 20px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover { background: #dc2626; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--gray);
            font-weight: 500;
        }

        .tabs-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .tabs-header {
            display: flex;
            border-bottom: 1px solid var(--gray-light);
        }

        .tab-btn {
            flex: 1;
            padding: 15px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            color: var(--gray);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .tab-btn:hover {
            background: #f9fafb;
            color: var(--primary);
        }

        .tab-btn.active {
            color: var(--primary);
            background: #f0f9ff;
            border-bottom: 3px solid var(--primary);
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active { display: block; }

        .message-item, .account-item {
            padding: 25px;
            border-bottom: 1px solid var(--gray-light);
        }

        .message-item:last-child, .account-item:last-child { border-bottom: none; }

        .message-header, .account-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .message-name, .account-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .message-time, .account-time {
            color: var(--gray);
            font-size: 0.85rem;
        }

        .message-email, .account-email {
            color: var(--primary);
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-content, .account-details {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            white-space: pre-wrap;
        }

        .reply-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--gray-light);
        }

        .reply-textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--gray-light);
            border-radius: 8px;
            min-height: 100px;
            margin: 15px 0;
            font-size: 1rem;
            font-family: inherit;
        }

        .btn-reply {
            padding: 10px 25px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-reply:hover { background: #059669; }

        .reply-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #d1fae5;
            color: #065f46;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .reply-content {
            background: #d1fae5;
            border-left: 4px solid var(--success);
            padding: 12px 15px;
            margin-top: 10px;
            border-radius: 0 8px 8px 0;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover { background: #4338ca; }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-overlay.show { display: flex; }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .feedback-status {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .feedback-status.success {
            display: block;
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .feedback-status.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .feedback-status.info {
            display: block;
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .btn-delete {
            padding: 8px 15px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .btn-delete:hover { background: #dc2626; }

        .file-item {
            padding: 25px;
            border-bottom: 1px solid var(--gray-light);
        }

        .file-item:last-child { border-bottom: none; }

        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .file-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-time {
            color: var(--gray);
            font-size: 0.85rem;
        }

        .file-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .file-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1><i class="fas fa-shield-alt"></i> 管理员登录</h1>
            <p style="color: var(--gray); margin-bottom: 30px;">请输入管理员密码以访问后台</p>
            <div class="error-message" id="loginError">密码错误，请重试</div>
            <input type="password" id="password" class="form-control" placeholder="密码">
            <button class="btn" id="loginBtn">登录</button>
        </div>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="container">
            <div class="admin-header">
                <div class="admin-title">
                    <i class="fas fa-user-shield"></i>
                    <span>留言管理后台</span>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> 退出登录
                </button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalMessages">0</div>
                    <div class="stat-label">总留言数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="repliedMessages">0</div>
                    <div class="stat-label">已回复</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pendingMessages">0</div>
                    <div class="stat-label">待回复</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalAccounts">0</div>
                    <div class="stat-label">注册用户</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalFiles">0</div>
                    <div class="stat-label">网盘文件</div>
                </div>
            </div>

            <div class="tabs-container">
                <div class="tabs-header">
                    <button class="tab-btn active" data-tab="messages">
                        <i class="fas fa-comments"></i> 留言管理
                    </button>
                    <button class="tab-btn" data-tab="accounts">
                        <i class="fas fa-users"></i> 账户管理
                    </button>
                    <button class="tab-btn" data-tab="files">
                        <i class="fas fa-folder-open"></i> 文件管理
                    </button>
                    <button class="refresh-btn" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i> 刷新
                    </button>
                </div>

                <div class="tab-content active" id="messagesTab">
                    <div class="feedback-status" id="messagesStatus"></div>
                    <div id="messageContainer">
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>暂无留言</h3>
                            <p>留言将显示在这里</p>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="accountsTab">
                    <div class="feedback-status" id="accountsStatus"></div>
                    <div id="accountContainer">
                        <div class="empty-state">
                            <i class="fas fa-users"></i>
                            <h3>暂无用户</h3>
                            <p>注册用户将显示在这里</p>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="filesTab">
                    <div class="feedback-status" id="filesStatus"></div>
                    <div id="fileContainer">
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <h3>暂无文件</h3>
                            <p>网盘文件将显示在这里</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "114514";
        const ENCODED_API_KEY = "V分2分p分K分c分0分1分H分R分k分l分W分b分W分x分Z分T分T分B分K分b分1分p分F分W分T分R分l分R分T分F分W分U分2分s分5分V分F分Z分U分V分l分p分V分M分n分h分G分Z分D分F分a分S分W分J分6分U分l分Z分i分S分E分E分w分V分l分V分V分M分W分E分y分U分l分h分a分R分V分Z分Z分T分U分Z分a分S分1分Z分X分e分G分9分X分R分0分5分W分V分W分x分K分U分0分1分F分c分G分F分Z分M分V分Z分3分U分l分U分x分c分k分9分U分U分m分x分i分V分G分x分Z分W分V分d分w分Y分V分N分X分T分n分V分X分b分X分R分U分V分l分h分o分a分F分l分V分V分l分d分X分b分E分5分W分Z分U分Z分k分U分m分J分H分a分D分N分a分R分V分J分h分V分0分d分W分W分F分R分U分S分l分V分h分e分m分x分o分V分F分R分C分U分1分Z分W分R分n分V分X分b分T分F分V分Y分m分x分a分R分F分R分s分V分m分t分k分Q分T分0分9";
        const GITHUB_USERNAME = "dyz131005";
        const GITHUB_REPO = "dyz131005.github.io";
        const ACCOUNTS_FILE = "accounts.yaml";
        const MESSAGES_FILE = "messages.yaml";
        const DRIVE_REPO = "drive";
        const DRIVE_FILES_FILE = "files.yaml";

        console.log("🔐 管理员密码: " + ADMIN_PASSWORD);

        let accountsData = {};
        let messagesData = [];
        let filesData = [];

        function decodeApiKey() {
            try {
                const withoutFen = ENCODED_API_KEY.replace(/分/g, '');
                const firstDecode = atob(withoutFen);
                const secondDecode = atob(firstDecode);
                const thirdDecode = atob(secondDecode);
                return thirdDecode;
            } catch (e) { return null; }
        }

        async function fetchYamlFile(filename, repo = GITHUB_REPO) {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${repo}/contents/${filename}`;
            const response = await fetch(url, {
                headers: {
                    'Authorization': `token ${apiKey}`,
                    'Accept': 'application/vnd.github.v3.raw'
                }
            });

            if (response.status === 404) return null;
            if (!response.ok) throw new Error(`获取${filename}失败: ${response.status}`);

            return await response.text();
        }

        async function saveYamlFile(filename, content, message = "更新文件", repo = GITHUB_REPO) {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${repo}/contents/${filename}`;
            
            let sha = null;
            const jsonResponse = await fetch(url, {
                headers: {
                    'Authorization': `token ${apiKey}`,
                    'Accept': 'application/vnd.github.v3+json'
                },
                cache: 'no-cache'
            });

            if (jsonResponse.ok) {
                const data = await jsonResponse.json();
                if (data.sha) sha = data.sha;
            }

            const base64Content = btoa(unescape(encodeURIComponent(content)));
            const requestBody = {
                message: message,
                content: base64Content
            };

            if (sha) requestBody.sha = sha;

            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(`保存${filename}失败: ${response.status} - ${text.substring(0, 100)}`);
            }
            return true;
        }

        async function loadData() {
            showLoading(true);
            try {
                const accountsContent = await fetchYamlFile(ACCOUNTS_FILE);
                accountsData = accountsContent ? jsyaml.load(accountsContent) || {} : {};

                const messagesContent = await fetchYamlFile(MESSAGES_FILE);
                messagesData = messagesContent ? jsyaml.load(messagesContent) || [] : [];

                const filesContent = await fetchYamlFile(DRIVE_FILES_FILE, DRIVE_REPO);
                filesData = filesContent ? jsyaml.load(filesContent) || [] : [];

                updateStats();
                renderMessages();
                renderAccounts();
                renderFiles();
            } catch (error) {
                console.error("加载数据失败:", error);
                showFeedbackStatus('messagesStatus', '加载数据失败: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        function updateStats() {
            const totalMessages = messagesData.length;
            const repliedMessages = messagesData.filter(m => m.replies && m.replies.length > 0).length;
            const pendingMessages = totalMessages - repliedMessages;
            const totalAccounts = Object.keys(accountsData).length;
            const totalFiles = filesData.length;

            document.getElementById('totalMessages').textContent = totalMessages;
            document.getElementById('repliedMessages').textContent = repliedMessages;
            document.getElementById('pendingMessages').textContent = pendingMessages;
            document.getElementById('totalAccounts').textContent = totalAccounts;
            document.getElementById('totalFiles').textContent = totalFiles;
        }

        function renderMessages() {
            const container = document.getElementById('messageContainer');
            if (!messagesData.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><h3>暂无留言</h3><p>留言将显示在这里</p></div>';
                return;
            }

            const sortedMessages = [...messagesData].sort((a, b) => 
                new Date(b.createdAt) - new Date(a.createdAt)
            );

            let html = '';
            sortedMessages.forEach(msg => {
                const hasReplies = msg.replies && msg.replies.length > 0;
                html += `
                    <div class="message-item" data-id="${msg.id}">
                        <div class="message-header">
                            <div class="message-name">
                                ${escapeHtml(msg.name)}
                                ${hasReplies ? '<span class="reply-badge">已回复</span>' : ''}
                            </div>
                            <div class="message-time">${formatTime(msg.createdAt)}</div>
                        </div>
                        <div class="message-email">
                            <i class="fas fa-envelope"></i>
                            ${escapeHtml(msg.email)}
                            <span style="color: var(--gray); margin-left: 10px;">
                                <i class="fas fa-user"></i> @${escapeHtml(msg.username)}
                            </span>
                        </div>
                        <div class="message-content">${escapeHtml(msg.content)}</div>
                `;

                if (hasReplies) {
                    msg.replies.forEach(reply => {
                        html += `
                            <div class="reply-content">
                                <div style="font-size: 0.8rem; color: #065f46; margin-bottom: 8px; font-weight: 600;">
                                    管理员回复于 ${formatTime(reply.createdAt)}
                                </div>
                                ${escapeHtml(reply.content)}
                            </div>
                        `;
                    });
                }

                if (!hasReplies) {
                    html += `
                        <div class="reply-section">
                            <h4 style="margin-bottom: 10px; color: var(--dark);">
                                <i class="fas fa-reply"></i> 回复此留言
                            </h4>
                            <textarea class="reply-textarea" id="reply-${msg.id}" placeholder="输入回复内容..."></textarea>
                            <button class="btn-reply" onclick="submitReply('${msg.id}')">
                                <i class="fas fa-paper-plane"></i> 发送回复
                            </button>
                        </div>
                    `;
                }

                html += `
                        <button class="btn-delete" onclick="deleteMessage('${msg.id}')">
                            <i class="fas fa-trash"></i> 删除此留言
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderAccounts() {
            const container = document.getElementById('accountContainer');
            const usernames = Object.keys(accountsData);
            if (!usernames.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><h3>暂无用户</h3><p>注册用户将显示在这里</p></div>';
                return;
            }

            const sortedAccounts = usernames.sort((a, b) => 
                new Date(accountsData[b].createdAt) - new Date(accountsData[a].createdAt)
            );

            let html = '';
            sortedAccounts.forEach(username => {
                const account = accountsData[username];
                html += `
                    <div class="account-item" data-username="${escapeHtml(username)}">
                        <div class="account-header">
                            <div class="account-name">
                                <i class="fas fa-user-circle"></i>
                                ${escapeHtml(account.name)}
                            </div>
                            <div class="account-time">注册于 ${formatTime(account.createdAt)}</div>
                        </div>
                        <div class="account-email">
                            <i class="fas fa-at"></i>
                            ${escapeHtml(username)}
                        </div>
                        <div class="account-details">
                            <strong>邮箱:</strong> ${escapeHtml(account.email)}<br>
                            <strong>显示姓名:</strong> ${escapeHtml(account.name)}
                        </div>
                        <button class="btn-delete" onclick="deleteAccount('${escapeHtml(username)}')">
                            <i class="fas fa-user-times"></i> 删除此用户
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderFiles() {
            const container = document.getElementById('fileContainer');
            if (!filesData.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i><h3>暂无文件</h3><p>网盘文件将显示在这里</p></div>';
                return;
            }

            const sortedFiles = [...filesData].sort((a, b) => 
                new Date(b.createdAt) - new Date(a.createdAt)
            );

            let html = '';
            sortedFiles.forEach(file => {
                html += `
                    <div class="file-item" data-id="${file.id}">
                        <div class="file-header">
                            <div class="file-name">
                                <i class="fas fa-file"></i>
                                ${escapeHtml(file.fileName)}
                            </div>
                            <div class="file-time">上传于 ${formatTime(file.createdAt)}</div>
                        </div>
                        <div class="file-meta">
                            <span><i class="fas fa-user"></i> ${escapeHtml(file.username)}</span>
                            <span><i class="fas fa-tag"></i> v${file.version}</span>
                            <span><i class="fas fa-file-size"></i> ${formatFileSize(file.size)}</span>
                            <span><i class="fas fa-layer-group"></i> ${file.totalChunks || 1} 个分片</span>
                        </div>
                        <button class="btn-delete" onclick="deleteFile('${file.id}')">
                            <i class="fas fa-trash"></i> 删除此文件
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function deleteFile(fileId) {
            if (!confirm('确定要删除这个文件吗？此操作不可撤销。')) return;

            showLoading(true);
            try {
                const fileIndex = filesData.findIndex(f => f.id === parseInt(fileId));
                if (fileIndex === -1) {
                    throw new Error('找不到此文件');
                }

                const file = filesData[fileIndex];
                const apiKey = decodeApiKey();
                if (!apiKey) throw new Error("API Key解码失败");

                const baseName = file.fileName.replace(/\.[^/.]+$/, '');
                const totalChunks = file.totalChunks || 1;
                
                for (let i = 0; i < totalChunks; i++) {
                    let filePath;
                    if (totalChunks === 1) {
                        filePath = `files/v${file.version}_${baseName}.bin`;
                    } else {
                        filePath = `files/v${file.version}_${baseName}_chunk${i}.bin`;
                    }
                    
                    const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${DRIVE_REPO}/contents/${filePath}`;
                    
                    const getResponse = await fetch(url, {
                        headers: {
                            'Authorization': `token ${apiKey}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    
                    if (getResponse.ok) {
                        const data = await getResponse.json();
                        const deleteResponse = await fetch(url, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `token ${apiKey}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `管理员删除文件: ${file.fileName}`,
                                sha: data.sha
                            })
                        });
                        
                        if (!deleteResponse.ok) {
                            console.warn(`删除分片 ${i} 失败: ${deleteResponse.status}`);
                        }
                    }
                }

                filesData.splice(fileIndex, 1);
                const yamlContent = jsyaml.dump(filesData);
                await saveYamlFile(DRIVE_FILES_FILE, yamlContent, `管理员删除文件`, DRIVE_REPO);

                showFeedbackStatus('filesStatus', '删除成功！', 'success');
                await loadData();
            } catch (error) {
                console.error('删除失败:', error);
                showFeedbackStatus('filesStatus', '删除失败: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function submitReply(messageId) {
            const content = document.getElementById(`reply-${messageId}`).value.trim();
            if (!content) {
                alert('请输入回复内容');
                return;
            }

            showLoading(true);
            try {
                const messageIndex = messagesData.findIndex(m => m.id === parseInt(messageId));
                if (messageIndex === -1) {
                    throw new Error('找不到此留言');
                }

                if (!messagesData[messageIndex].replies) {
                    messagesData[messageIndex].replies = [];
                }

                messagesData[messageIndex].replies.push({
                    content: content,
                    createdAt: new Date().toISOString()
                });

                const yamlContent = jsyaml.dump(messagesData);
                await saveYamlFile(MESSAGES_FILE, yamlContent, `管理员回复留言: ${messagesData[messageIndex].username}`);

                showFeedbackStatus('messagesStatus', '回复成功！', 'success');
                await loadData();
            } catch (error) {
                console.error('回复失败:', error);
                showFeedbackStatus('messagesStatus', '回复失败: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        async function deleteMessage(messageId) {
            if (!confirm('确定要删除这条留言吗？此操作不可撤销。')) return;

            showLoading(true);
            try {
                const originalLength = messagesData.length;
                messagesData = messagesData.filter(m => m.id !== parseInt(messageId));

                if (messagesData.length === originalLength) {
                    throw new Error('找不到此留言');
                }

                const yamlContent = jsyaml.dump(messagesData);
                await saveYamlFile(MESSAGES_FILE, yamlContent, `管理员删除留言`);

                showFeedbackStatus('messagesStatus', '删除成功！', 'success');
                await loadData();
            } catch (error) {
                console.error('删除失败:', error);
                showFeedbackStatus('messagesStatus', '删除失败: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        async function deleteAccount(username) {
            if (!confirm(`确定要删除用户 "${username}" 吗？此操作不可撤销。`)) return;

            showLoading(true);
            try {
                if (!accountsData[username]) {
                    throw new Error('找不到此用户');
                }

                delete accountsData[username];

                const yamlContent = jsyaml.dump(accountsData);
                await saveYamlFile(ACCOUNTS_FILE, yamlContent, `管理员删除用户: ${username}`);

                showFeedbackStatus('accountsStatus', '删除成功！', 'success');
                await loadData();
            } catch (error) {
                console.error('删除失败:', error);
                showFeedbackStatus('accountsStatus', '删除失败: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        function showFeedbackStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `feedback-status ${type}`;
            element.style.display = 'block';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '未知';
            try {
                return new Date(timestamp).toLocaleString('zh-CN');
            } catch {
                return timestamp;
            }
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        document.getElementById('loginBtn').addEventListener('click', function() {
            const password = document.getElementById('password').value.trim();
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadData();
            } else {
                document.getElementById('loginError').classList.add('show');
            }
        });

        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('password').value = '';
        });

        document.getElementById('refreshBtn').addEventListener('click', loadData);

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.dataset.tab + 'Tab').classList.add('active');
            });
        });
    </script>
</body>
</html>
